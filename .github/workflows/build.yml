name: Build and smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test platform-neutral core
        run: dotnet run --project tests/AutomationMonitor.Core.Smoke/AutomationMonitor.Core.Smoke.csproj --configuration Release

  windows-plugin:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore plugin
        run: dotnet restore src/AutomationMonitor.Plugin/AutomationMonitor.Plugin.csproj
      - name: Build Windows XrmToolBox plugin
        run: dotnet build src/AutomationMonitor.Plugin/AutomationMonitor.Plugin.csproj --configuration Release --no-restore
      - name: Prepare plugin artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item src/AutomationMonitor.Plugin/bin/Release/net48/AutomationMonitor.Plugin.dll staging/
          Copy-Item src/AutomationMonitor.Plugin/bin/Release/net48/AutomationMonitor.Core.dll staging/
          if (Test-Path src/AutomationMonitor.Plugin/bin/Release/net48/AutomationMonitor.Plugin.pdb) {
            Copy-Item src/AutomationMonitor.Plugin/bin/Release/net48/AutomationMonitor.Plugin.pdb staging/
          }
      - uses: actions/upload-artifact@v4
        with:
          name: automation-monitor-plugin
          path: staging/
